name = "reno-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 (relational data: projects, splat models, tickets, measurements, users, ...) ---
[[d1_databases]]
binding = "DB"
database_name = "reno"
database_id = "f3a53689-0ee2-4195-ba5a-784155fe3406"
migrations_dir = "migrations"

# --- R2 (splat files, raw capture frames, thumbnails) ---
[[r2_buckets]]
binding = "SPLATS"
bucket_name = "reno-splats"

# --- Durable Object: per-model job state machine + resumable upload coordination ---
[[durable_objects.bindings]]
name = "SPLAT_JOB"
class_name = "SplatJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SplatJob"]

# --- KV (cache: JWKS, sessions) ---
[[kv_namespaces]]
binding = "CACHE"
id = "8fb2fc0d334b4719a03db12f15efac1f"

[vars]
# Public, non-secret config. Secrets (none required for Auth0 verification) go via `wrangler secret put`.
AUTH0_DOMAIN = "your-tenant.us.auth0.com"
AUTH0_AUDIENCE = "https://api.renosphere.co"
CORS_ORIGIN = "http://localhost:5173"
# SIGNING_SECRET is a secret, NOT a var — set via `wrangler secret put SIGNING_SECRET`.
# (For local dev, put it in apps/api/.dev.vars, which is gitignored.)

[observability]
enabled = true
