name = "reno-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (zone 10kbto.homes is on this Cloudflare account). Wrangler
# provisions the hostname + cert and routes it to this Worker.
routes = [
  { pattern = "app.10kbto.homes", custom_domain = true },
]
workers_dev = true  # keep the *.workers.dev URL as a fallback/test endpoint

# Serve the built SPA (apps/web/dist) as static assets from the same Worker.
# The Worker runs first only for /api/*; everything else is served from assets,
# with SPA fallback to index.html for client-side routes. One origin, no CORS.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# --- D1 (relational data: projects, splat models, tickets, measurements, users, ...) ---
[[d1_databases]]
binding = "DB"
database_name = "reno"
database_id = "f3a53689-0ee2-4195-ba5a-784155fe3406"
migrations_dir = "migrations"

# --- R2 (splat files, raw capture frames, thumbnails) ---
[[r2_buckets]]
binding = "SPLATS"
bucket_name = "reno-splats"

# --- Durable Object: per-model job state machine + resumable upload coordination ---
[[durable_objects.bindings]]
name = "SPLAT_JOB"
class_name = "SplatJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SplatJob"]

# --- Cloudflare Email Service: send OTP emails from the Worker (env.EMAIL.send) ---
# Requires enabling Email Sending + verifying the sender domain in the dashboard.
[[send_email]]
name = "EMAIL"

# --- KV (cache: OTP codes, sessions) ---
[[kv_namespaces]]
binding = "CACHE"
id = "8fb2fc0d334b4719a03db12f15efac1f"

[vars]
# Public, non-secret config. Secrets go via `wrangler secret put`.
CORS_ORIGIN = "http://localhost:5173"
APP_NAME = "Reno"
OTP_FROM_EMAIL = "Reno <login@10kbto.homes>"
# Dev: returns/logs the OTP so sign-in works without email infra. Set to "false" in prod.
OTP_DEV_MODE = "true"
# Secrets (NOT vars): SIGNING_SECRET (sessions + file URLs), RESEND_API_KEY (email).
# Set via `wrangler secret put ...`; for local dev use apps/api/.dev.vars (gitignored).

[observability]
enabled = true
